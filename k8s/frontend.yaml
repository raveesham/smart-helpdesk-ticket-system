# Placeholder image name and port; align with upstream Next.js Dockerfile.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-frontend
  namespace: helpdesk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpdesk-frontend
  template:
    metadata:
      labels:
        app: helpdesk-frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_DOCKERHUB_USER/smart-helpdesk-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: helpdesk-config
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-frontend
  namespace: helpdesk
spec:
  selector:
    app: helpdesk-frontend
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
