apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smart-helpdesk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_GITHUB_USER/YOUR_REPOSITORY.git
    targetRevision: main
    path: helm/smart-helpdesk
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: helpdesk
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
